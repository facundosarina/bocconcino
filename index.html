<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bocconcino</title>
<meta name="description" content="Diario alimentare: fotografa il pasto e scopri calorie e nutrienti.">
<meta name="theme-color" content="#FFEFF4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#2A1830" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bocconcino">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <main>
    <section id="view-oggi" class="view" aria-label="Oggi"></section>
    <section id="view-settimana" class="view" aria-label="Settimana" hidden></section>
    <section id="view-impostazioni" class="view" aria-label="Impostazioni" hidden></section>
  </main>

  <nav class="tabbar" aria-label="Navigazione">
    <button class="tab" data-act="vai" data-view="oggi" aria-current="page">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11h18a9 9 0 0 1-18 0Z"/><path d="M8 7c0-1.5 1-2 1-3.5M12 7c0-1.5 1-2 1-3.5M16 7c0-1.5 1-2 1-3.5"/></svg>
      <span>Oggi</span>
    </button>
    <button class="fab" data-act="aggiungi" aria-label="Aggiungi un pasto">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8.5A2.5 2.5 0 0 1 6.5 6h1.7l1.3-2h5l1.3 2h1.7A2.5 2.5 0 0 1 20 8.5v8a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 16.5Z"/><circle cx="12" cy="12.5" r="3.5"/></svg>
    </button>
    <button class="tab" data-act="vai" data-view="settimana">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V12M10 20V6M15 20v-9M20 20V9"/></svg>
      <span>Settimana</span>
    </button>
  </nav>
</div>

<div id="sheet" class="sheet" hidden>
  <div class="sheet-fondo" data-act="chiudi-sheet"></div>
  <div class="sheet-pannello" role="dialog" aria-modal="true" aria-labelledby="sheet-titolo">
    <div class="sheet-maniglia" aria-hidden="true"></div>
    <div id="sheet-corpo"></div>
  </div>
</div>

<input type="file" id="file-cam" accept="image/*" capture="environment" hidden>
<input type="file" id="file-gal" accept="image/*" hidden>
<input type="file" id="file-backup" accept="application/json,.json" hidden>
<div id="toast" role="status" aria-live="polite"></div>

<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
